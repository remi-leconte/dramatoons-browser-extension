name: Livraison

# Tag vX.Y.Z posé sur main : le zip de production est construit et joint à la release GitHub du tag.
# L'envoi sur les stores reste manuel, depuis ce zip
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: livraison
  cancel-in-progress: false

jobs:
  construction:
    name: Construction
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Le zip construit ici est publié : actions épinglées sur un commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # Pas de cache npm : le zip publié ne dépend que du lockfile, installé à neuf
          package-manager-cache: false

      - name: Tag et version
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Le tag $tag n'est pas de la forme vX.Y.Z : rien n'est livré"
            exit 1
          fi
          # Seul un commit posé directement sur main (fusion d'une PR, donc relue) est livré : un commit intermédiaire
          # d'une branche fusionnée est un ancêtre de main, mais n'a pas été relu tel quel
          # grep sans -q lit toute la liste : arrêté plus tôt, il ferait échouer git rev-list avec pipefail
          if ! git rev-list --first-parent origin/main | grep -x "$GITHUB_SHA" >/dev/null; then
            echo "::error::Le tag $tag n'est pas posé directement sur main : rien n'est livré"
            exit 1
          fi
          version=$(node -p "require('./src/manifest.json').version")
          if [[ v$version != "$tag" ]]; then
            echo "::error::Le tag $tag ne correspond pas à la version du manifeste ($version) : rien n'est livré"
            exit 1
          fi

      - run: npm ci

      - run: npm run ci

      - run: npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip
          path: dist/dramatoons-highlighter-*.zip
          if-no-files-found: error

  publication:
    name: Release GitHub
    needs: construction
    runs-on: ubuntu-24.04
    # Seul job en écriture : il n'installe rien et n'exécute aucun code du dépôt ni de ses dépendances
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zip
          path: dist

      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/dramatoons-highlighter-*.zip \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
